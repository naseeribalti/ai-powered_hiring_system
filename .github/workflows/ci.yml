name: CI

on:
  push:
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies (npm ci)
        run: npm ci

      - name: Show resolved versions
        run: |
          npm ls cloudinary multer-storage-cloudinary || true

      - name: Run ESLint
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Validate docker compose configuration
        run: docker compose -f deployment/docker/docker-compose.yml config

  ai-ml-smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install pytest
        run: python -m pip install --upgrade pip && pip install pytest

      - name: Run ai-ml smoke tests
        run: pytest ai-ml/tests/smoke_test.py -q
